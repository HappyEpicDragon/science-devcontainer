[project]
name = "my-devcontainer-demo"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
run = "python src/main.py"
notebook = "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root"

[dependencies]
python = "3.11.*"
numpy = "*"
scipy = "*"
pandas = "*"
matplotlib = "*"
jupyterlab = "*"
ipykernel = "*"

